# Avisos de atualização (auditoria de segurança SEC-10). Cada PR passa pelo CI inteiro antes de entrar.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Decisão do Jonas (07/11/2026): o projeto fica no .NET 9, sem migrar para o 10. Só atualizações de patch e minor das imagens.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
